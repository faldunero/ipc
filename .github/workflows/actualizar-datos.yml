name: 🔄 Actualizar Datos Macroeconómicos IPC

on:
  schedule:
    # Diariamente a las 09:00 UTC (04:00 Chile)
    - cron: '0 9 * * *'

  # Para ejecutar manualmente desde GitHub UI
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas statsmodels xgboost tensorflow scikit-learn

      - name: 🚀 Actualizar datos macro
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 actualizar_datos_macro.py

      - name: 📡 Recolectar datos exógenos (BC + Combustibles + Índices)
        run: |
          echo "📊 Recolectando variables exógenas..."
          python3 fetch_external_data.py
          echo "✅ Datos exógenos listos"

      - name: 🛒 Recolectar datos REALES de canasta (Alimentos, Ropa, Transporte, Servicios)
        run: |
          echo "🛒 Recolectando canasta IPC real..."
          python3 fetch_canasta_real.py
          echo "✅ Canasta real cargada"

      - name: 🧠 Reentrenar modelos con nuevos datos
        run: |
          echo "🔄 Iniciando reentrenamiento de modelos..."
          python3 backtest_proper.py
          echo "✅ Reentrenamiento completado"

      - name: 🔮 Generar forecast avanzado para próximo mes
        run: |
          echo "🔮 Calculando forecast con variables exógenas..."
          python3 -c "from advanced_forecasting import AdvancedForecaster; from fetch_external_data import consolidar_datos_exogenos; import json; datos=consolidar_datos_exogenos(); f=AdvancedForecaster(); print(json.dumps(f.forecast_ensemble_avanzado([4.99,4.78,4.89,4.59,4.49,4.17,4.38,4.07,4.38,3.36,3.46,3.46,2.75], datos), indent=2))"
          echo "✅ Forecast generado"

      - name: 📊 Integrar datos reales de IPC
        run: |
          echo "📥 Integrando datos reales del Banco Central..."
          python3 integrate_real_ipc_data.py
          echo "✅ Integración completada"

      - name: 💾 Guardar cambios en repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "🤖 GitHub Action"
          git add \
            cache_datos_macro.json \
            datos_exogenos.json \
            canasta_real.json \
            predicciones_historico.json \
            backtest_proper_resultados.json \
            logs/actualizacion.log \
            2>/dev/null || true
          git commit -m "🔄 Actualización IPC: datos BC + reentrenamiento ARIMA/XGBoost/LSTM ($(date +'%Y-%m-%d %H:%M UTC'))" || echo "✅ Sin cambios"
          git push
